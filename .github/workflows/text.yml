name: liquidity-text

# Downloads Fed texts, scores them (dictionary + FOMC-RoBERTa on CPU),
# rebuilds the index with the text tone and commits the results.
# Raw HTML and the model are cached between runs, not committed.
on:
  push:
    branches: [claude/liquidity-step1]
    paths: ["liquidity/text/**", "requirements-text.txt", ".github/workflows/text.yml", ".github/scripts/**"]
  workflow_dispatch:
    inputs:
      rescore:
        description: "Re-run the model on every document"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: liquidity-branch-writes
  cancel-in-progress: false

jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-text.txt
      - uses: actions/cache@v4
        with:
          path: |
            data/text/raw
            ~/.cache/huggingface
          key: text-raw-${{ github.run_id }}
          restore-keys: text-raw-
      - run: python -m pytest -q
      - name: Fetch and score Fed texts
        env:
          PYTHONUNBUFFERED: "1"
          # FOMC-RoBERTa is a gated model: a HuggingFace read token from an
          # account that accepted its terms. Without it, dictionary only.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m liquidity.text --start 2008 --scorers dict,model ${{ inputs.rescore && '--rescore' || '' }}
      - name: Rebuild index with text tone
        run: |
          set -o pipefail
          python -m liquidity --out output 2>&1 | tee output/run_log.txt
      - name: Commit scores and outputs
        if: always()
        run: .github/scripts/commit_outputs.sh "Update hawk/dove text scores [skip ci]" data/text/doc_scores.csv data/text/weekly_tone.csv data/text/fetch_report.csv data/text/latest_sentences.csv output
