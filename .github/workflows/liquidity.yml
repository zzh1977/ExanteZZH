name: liquidity-step1

# Runs the FRED pipeline on GitHub's runners (open internet) and commits the
# downloaded data and outputs back to the branch.
on:
  push:
    branches: [claude/liquidity-step1]
    paths: ["liquidity/**", "tests/**", "requirements.txt", ".github/workflows/liquidity.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build index from FRED
        run: |
          set -o pipefail
          python -m liquidity --out output --refresh 2>&1 | tee output_log.txt
          mv output_log.txt output/run_log.txt
      - name: Commit data and outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw output || true
          git diff --cached --quiet && exit 0
          git commit -m "Update FRED data and liquidity outputs [skip ci]"
          git push
