<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column, sticky document switcher, wide tables and commands scroll inside their own boxes */
:root {
  --bg: #f5f6f3;
  --surface: #ffffff;
  --fg: #1c2321;
  --muted: #5a6662;
  --rule: #d6dcd8;
  --accent: #0e6a5b;
  --accent-soft: #e1efeb;
  --code-bg: #eceee9;
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Noto Sans SC", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --surface: #191e1d; --fg: #e2e8e5; --muted: #97a39e; --rule: #2c3532;
    --accent: #5ec4ae; --accent-soft: #1d2f2b; --code-bg: #1e2423; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --surface: #191e1d; --fg: #e2e8e5; --muted: #97a39e; --rule: #2c3532;
  --accent: #5ec4ae; --accent-soft: #1d2f2b; --code-bg: #1e2423; color-scheme: dark;
}

html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.75;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
.wrap {
  max-width: 50rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Masthead */
.mast { background: var(--surface); border-bottom: 1px solid var(--rule); }
.mast .wrap { padding-block: 2.25rem 1.5rem; display: grid; gap: 0.6rem; }
.mast h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(1.7rem, 4.5vw, 2.4rem); line-height: 1.3; text-wrap: balance;
}
.mast p { margin: 0; color: var(--muted); max-width: 40rem; }
.spec { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; padding: 0; list-style: none; }
.spec li {
  font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.02em;
  padding: 0.15rem 0.55rem; border: 1px solid var(--rule); border-radius: 4px; color: var(--muted);
}

/* Sticky switcher */
.switch {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--rule);
}
.switch .wrap { display: flex; gap: 0.25rem; overflow-x: auto; padding-block: 0.5rem; scrollbar-width: none; }
.switch a {
  flex: none; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 0.92rem;
  padding: 0.35rem 0.8rem; border-radius: 999px;
}
.switch a:hover, .switch a.on { color: var(--accent); background: var(--accent-soft); }
.switch a:focus-visible, a:focus-visible, button:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* Documents */
main .wrap { padding-block: 1rem 4rem; }
.doc { padding-top: 1.5rem; }
.doc + .doc { margin-top: 3rem; border-top: 3px double var(--rule); }
.src { margin: 0 0 0.25rem; font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; }
.src code { background: none; padding: 0; }
.doc h1 {
  font-family: var(--font-display); font-weight: 700; font-size: 1.85rem; line-height: 1.35;
  margin: 0.2rem 0 1rem; text-wrap: balance;
}
.doc h2 {
  font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; line-height: 1.4;
  margin: 2.6rem 0 0.8rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--rule); text-wrap: balance;
}
.doc h3 { font-size: 1.12rem; font-weight: 700; margin: 2rem 0 0.6rem; color: var(--accent); text-wrap: balance; }
.doc h4 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
.doc p, .doc li { max-width: 42rem; }
.doc ul, .doc ol { padding-left: 1.4rem; }
.doc li + li { margin-top: 0.2rem; }
.doc li > ul, .doc li > ol { margin: 0.3rem 0; }
.doc a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
.doc hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
.doc strong { font-weight: 700; }
.doc blockquote {
  margin: 1rem 0; padding: 0.6rem 1rem; background: var(--accent-soft);
  border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0;
}
.doc blockquote p { margin: 0.3rem 0; }

code {
  font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg);
  padding: 0.1em 0.35em; border-radius: 4px; overflow-wrap: anywhere;
}
.code { position: relative; margin: 0.8rem 0 1.1rem; min-width: 0; }
.code pre {
  margin: 0; overflow-x: auto; background: var(--code-bg); border: 1px solid var(--rule);
  border-radius: 6px; padding: 0.85rem 1rem; padding-right: 4.2rem; line-height: 1.6;
}
.code pre code { background: none; padding: 0; font-size: 0.85rem; overflow-wrap: normal; white-space: pre; }
.copy {
  position: absolute; top: 0.45rem; right: 0.45rem; font: 500 0.75rem var(--font-body);
  color: var(--muted); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 4px; padding: 0.15rem 0.55rem; cursor: pointer;
}
.copy:hover { color: var(--accent); border-color: var(--accent); }

.tbl { overflow-x: auto; margin: 0.8rem 0 1.2rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.9rem; line-height: 1.6; }
.tbl th, .tbl td { padding: 0.5rem 0.7rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
.tbl th { font-weight: 700; background: var(--code-bg); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td { min-width: 6rem; }
.tbl td:first-child { min-width: 5rem; }

.toc {
  margin: 0.5rem 0 1.5rem; background: var(--surface); border: 1px solid var(--rule);
  border-radius: 6px; padding: 0.6rem 1rem;
}
.toc summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--muted); letter-spacing: 0.04em; }
.toc > ol, .toc > ul { margin: 0.5rem 0 0.2rem; padding-left: 1.3rem; columns: 2 16rem; column-gap: 2rem; font-size: 0.9rem; }
.toc ul ul { padding-left: 1.1rem; margin: 0.1rem 0; font-size: 0.95em; }
.toc p { display: none; }
.toc > ol > li, .toc > ul > li { break-inside: avoid; }
.toc a { text-decoration: none; }
.toc a:hover { text-decoration: underline; }

.foot { color: var(--muted); font-size: 0.82rem; border-top: 1px solid var(--rule); margin-top: 3rem; padding-top: 1rem; }
</style>

<header class="mast">
  <div class="wrap">
    <h1>{{TITLE}}</h1>
{{SUBTITLE}}{{TAGS}}  </div>
</header>

{{NAV_BLOCK}}

<main>
  <div class="wrap">
{{ARTICLES}}
{{FOOT}}
  </div>
</main>

<script>
(function () {
  // Copy buttons on every command block
  document.querySelectorAll(".code").forEach(function (box) {
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "copy"; btn.textContent = "复制";
    btn.addEventListener("click", function () {
      var text = box.querySelector("code").innerText;
      function done(msg) { btn.textContent = msg; setTimeout(function () { btn.textContent = "复制"; }, 1500); }
      function fallback() {
        var r = document.createRange(); r.selectNodeContents(box.querySelector("code"));
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        done("已选中，按 Ctrl+C");
      }
      try {
        navigator.clipboard.writeText(text).then(function () { done("已复制"); }, fallback);
      } catch (e) { fallback(); }
    });
    box.appendChild(btn);
  });

  // Highlight the document currently on screen
  var links = Array.prototype.slice.call(document.querySelectorAll(".switch a"));
  var docs = links.map(function (a) { return document.querySelector(a.getAttribute("href")); });
  function mark() {
    var y = window.scrollY + 120, cur = 0;
    docs.forEach(function (d, i) { if (d && d.offsetTop <= y) cur = i; });
    links.forEach(function (a, i) { a.classList.toggle("on", i === cur); });
  }
  window.addEventListener("scroll", mark, { passive: true });
  mark();
})();
</script>
